server:
  port: ${RESUME_SERVICE_PORT:8087}

spring:
  application:
    name: resume-service
  datasource:
    url: ${RESUME_DB_URL:jdbc:postgresql://localhost:5432/resume_db}
    username: ${RESUME_DB_USERNAME:postgres}
    password: ${RESUME_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${RESUME_KAFKA_CONSUMER_GROUP:resume-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET}

resume:
  kafka:
    enabled: ${RESUME_KAFKA_ENABLED:true}
    topics:
      uploaded: ${RESUME_UPLOADED_TOPIC:resume.uploaded.v1}
      parse-requested: ${RESUME_PARSE_REQUESTED_TOPIC:resume.parse.requested.v1}
  storage:
    provider: ${RESUME_STORAGE_PROVIDER:local}
    local-root: ${RESUME_STORAGE_ROOT:./data/resumes}
  upload:
    max-file-bytes: ${RESUME_MAX_UPLOAD_BYTES:5242880}
  outbox:
    enabled: ${RESUME_OUTBOX_ENABLED:true}
    poll-interval-ms: ${RESUME_OUTBOX_POLL_INTERVAL_MS:1000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus